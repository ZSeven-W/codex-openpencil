<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root { color-scheme:light; --background:#efefef; --text:#68686d; }
:root[data-theme="dark"] { color-scheme:dark; --background:#121212; --text:#a3a3a3; }
html,body { margin:0; height:100%; min-height:600px; background:var(--background); color:var(--text); font:14px sans-serif; }
iframe { border:0; width:100%; height:100vh; min-height:600px; display:block; }
#notice { padding:20px; }
[hidden] { display:none!important; }
</style></head><body><div id="notice" role="status">连接 OpenPencil 画布…</div><iframe id="panel" title="OpenPencil Canvas" hidden allow="clipboard-read; clipboard-write; local-fonts"></iframe><script>
const pending = new Map();
let nextId = 1, panelOrigin, hostCapabilities = {}, opened = false;
let hostTheme, hostThemeChanged = false;
const frame = document.getElementById('panel'), notice = document.getElementById('notice');
const systemTheme = window.matchMedia?.('(prefers-color-scheme: dark)');
const validTheme = value => value === 'light' || value === 'dark';
let compatibilityTheme = validTheme(window.openai?.theme) ? window.openai.theme : undefined;
let colorScheme;
let lastContext;
const codegenRequests = new Set();

async function handoffCodegen(value) {
  if (typeof value.requestId !== 'string' || typeof value.prompt !== 'string' || value.prompt.length > 16_384 || codegenRequests.has(value.requestId)) return;
  codegenRequests.add(value.requestId);
  if (codegenRequests.size > 64) codegenRequests.delete(codegenRequests.values().next().value);
  let status = 'unsupported';
  try {
    if (hostCapabilities.message?.text) {
      const result = await request('ui/message', { role: 'user', content: [{ type: 'text', text: value.prompt }] });
      status = result?.isError ? 'unknown' : 'accepted';
    } else if (hostCapabilities.updateModelContext) {
      await request('ui/update-model-context', { content: [{ type: 'text', text: value.prompt }] });
    }
  } catch { status = 'unknown'; }
  frame.contentWindow?.postMessage({ type: 'codex-canvas/codegen-result', requestId: value.requestId, status }, panelOrigin);
}

function sendTheme() {
  if (opened) frame.contentWindow?.postMessage({ type:'codex-canvas/theme', colorScheme }, panelOrigin);
}
function applyTheme() {
  const nextTheme = hostTheme || compatibilityTheme || (systemTheme?.matches ? 'dark' : 'light');
  if (colorScheme === nextTheme) return;
  colorScheme = nextTheme;
  document.documentElement.dataset.theme = colorScheme;
  document.documentElement.style.colorScheme = colorScheme;
  sendTheme();
}
function acceptHostTheme(value) {
  if (!validTheme(value)) return;
  hostTheme = value;
  applyTheme();
}
systemTheme?.addEventListener('change', applyTheme);
window.addEventListener('openai:set_globals', event => {
  const theme = event.detail?.globals?.theme;
  if (!validTheme(theme)) return;
  compatibilityTheme = theme;
  applyTheme();
});
frame.addEventListener('load', sendTheme);
applyTheme();

function request(method, params) {
  const id = `canvas-${nextId++}`;
  return new Promise((resolve,reject) => {
    const timer = setTimeout(() => { pending.delete(id); reject(new Error('插件连接超时，请重新打开画布。')); }, 20000);
    pending.set(id,{resolve,reject,timer}); window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
  });
}
function show(result) {
  if (result?.isError) { notice.hidden = false; notice.textContent = result.content?.[0]?.text || '画布未打开'; return; }
  const raw = result?.structuredContent?.panelUrl;
  if (!raw || opened) return;
  let url; try { url = new URL(raw); } catch { return; }
  if (url.protocol !== 'http:' || url.hostname !== '127.0.0.1' || !/^\/canvas\/[A-Za-z0-9_-]{43}$/.test(url.pathname) || url.search || url.hash || url.username || url.password) return;
  // The local server deliberately rejects query parameters. Seed the first paint
  // through the fragment; subsequent changes never navigate the active document.
  url.hash = `theme=${colorScheme}`;
  opened = true; panelOrigin = url.origin; frame.src = url.href; frame.hidden = false; notice.hidden = true;
}
window.addEventListener('message', event => {
  if (event.source === frame.contentWindow && event.origin === panelOrigin) {
    if (event.data?.type === 'codex-canvas/ready') sendTheme();
    if (event.data?.type === 'codex-canvas/codegen') void handoffCodegen(event.data);
    if (event.data?.type === 'codex-canvas/context' && hostCapabilities.updateModelContext) {
      const context = JSON.stringify({canvasFile:event.data.filePath,selection:event.data.selection});
      if (context !== lastContext) {
        lastContext = context;
        request('ui/update-model-context',{content:[{type:'text',text:context}]}).catch(()=>{ if (lastContext === context) lastContext = undefined; });
      }
    }
    return;
  }
  if (event.source !== window.parent || event.data?.jsonrpc !== '2.0') return;
  const message = event.data;
  if (pending.has(message.id)) { const p=pending.get(message.id);clearTimeout(p.timer);pending.delete(message.id);message.error?p.reject(new Error(message.error.message)):p.resolve(message.result); }
  if (message.method === 'ui/notifications/host-context-changed' && validTheme(message.params?.theme)) {
    hostThemeChanged = true;
    acceptHostTheme(message.params.theme);
  }
  if (message.method === 'ui/notifications/tool-result') show(message.params);
  if (message.method === 'ping') window.parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');
  if (message.method === 'ui/resource-teardown') window.parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');
});
(async()=>{
  const initialized=await request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'OpenPencil Canvas',version:'0.3.9'},appCapabilities:{availableDisplayModes:['inline','fullscreen']}});
  hostCapabilities=initialized.hostCapabilities||{};
  // A notification received during initialization is newer than its response.
  if (!hostThemeChanged) acceptHostTheme(initialized.hostContext?.theme);
  window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');
  // Entrypoints send {}; reopening never replaces this conversation's active document.
  if (hostCapabilities.serverTools) show(await request('tools/call',{name:'open_canvas',arguments:{}}));
})().catch(error=>{notice.textContent=error.message;});
</script></body></html>
